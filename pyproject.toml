[project]
name = "multiprofile"
version = "0.1.0"
description = "Personal multi-profile browser: isolated Camoufox profiles with stable fingerprints, per-profile proxies and a local automation API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx[socks]>=0.27",
    "pynacl>=1.5",
    "keyring>=25",
    "geoip2>=4.8",
    "zstandard>=0.22",
    "psutil>=5.9",
    "platformdirs>=4",
    "camoufox[geoip]>=0.5.9",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pyinstaller>=6.6",
    "keyrings.alt>=5",
]

[project.scripts]
multiprofile-daemon = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["desktop", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a real Camoufox browser binary (run `camoufox fetch` first)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/services/browser.py" = ["E501"]
