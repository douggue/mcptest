name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv -p 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Test (mock engine)
        env:
          MULTIPROFILE_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        run: uv run pytest -q -m "not integration"

  desktop-web:
    name: desktop web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build

  # Full Windows installer. Runs on tags only: it needs Rust + VS Build Tools and takes a while.
  installer:
    name: windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze daemon
        run: |
          uv venv -p 3.12
          uv pip install -e ".[dev]"
          uv run python scripts/build_daemon.py
      - name: Build Tauri app
        working-directory: desktop
        run: |
          npm install
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
