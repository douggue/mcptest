name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build pinned shipped media tools (macOS)
        if: runner.os == 'macOS'
        run: |
          npm run media:build
          tools="$GITHUB_WORKSPACE/media-tools/darwin-$(node -p process.arch)"
          echo "$tools" >> "$GITHUB_PATH"
          echo "REACUT_FFMPEG=$tools/ffmpeg" >> "$GITHUB_ENV"
          echo "REACUT_FFPROBE=$tools/ffprobe" >> "$GITHUB_ENV"
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        # Chocolatey puts launcher shims on PATH; a shim outlives a cancelled child, so use the real programs.
        run: |
          choco install ffmpeg --no-progress -y
          $tools = (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "REACUT_FFMPEG=$tools\ffmpeg.exe" >> $env:GITHUB_ENV
          "REACUT_FFPROBE=$tools\ffprobe.exe" >> $env:GITHUB_ENV
      - run: npm run check
      - name: Browser localization (Linux)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:i18n
      - name: Desktop localization (macOS)
        if: runner.os == 'macOS'
        run: npx tsx tests/i18n-electron.ts
      - name: Desktop integration (macOS)
        if: runner.os == 'macOS'
        run: npm run check:desktop
      - name: Local workflow regressions (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tsx tests/assistant-assets-electron.ts
          npx tsx tests/subtitle-electron.ts
          npx tsx tests/subtitle-workflow-electron.ts
          npx tsx tests/templates-electron.ts
          npx tsx tests/portable-range-electron.ts
          npx tsx tests/source-preview-electron.ts
          npx tsx tests/timeline-edits-electron.ts
          npx tsx tests/derivatives-electron.ts
          npx tsx tests/keyframe-curves-electron.ts
          npx tsx tests/workspace-electron.ts
          npx tsx tests/large-subtitles-electron.ts
      - name: Upload desktop evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-evidence
          path: |
            docs/screenshots/
            .test-output/*-electron/evidence.json
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run licenses
      - run: npm run dist:mac:installer
      - uses: actions/upload-artifact@v7
        with:
          name: JGcut-macOS
          path: |
            release/JGcut*.dmg
            release/JGcut*mac.zip
  media-tools-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the mingw-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm pkg-config make cmake
      # The recipe re-verifies a restored build against its manifest and rebuilds if anything differs.
      - uses: actions/cache@v6
        with:
          path: |
            media-tools/win32-x64
            .media-build/downloads
          key: media-tools-win32-x64-${{ hashFiles('scripts/build-media-tools-win.mjs') }}
      - name: Cross-compile pinned shipped media tools (Windows x64)
        run: npm run media:build:win
      - uses: actions/upload-artifact@v7
        with:
          name: media-tools-win32-x64
          path: media-tools/win32-x64
          if-no-files-found: error
      - uses: actions/cache@v6
        with:
          path: speech-tools/win32-x64
          key: speech-tools-win32-x64-${{ hashFiles('scripts/build-speech-tools-win.mjs') }}
      - name: Cross-compile the pinned speech recognition engine (Windows x64)
        run: npm run speech:build:win
      - uses: actions/upload-artifact@v7
        with:
          name: speech-tools-win32-x64
          path: speech-tools/win32-x64
          if-no-files-found: error
  package-windows:
    needs: media-tools-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@v8
        with:
          name: media-tools-win32-x64
          path: media-tools/win32-x64
      - uses: actions/download-artifact@v8
        with:
          name: speech-tools-win32-x64
          path: speech-tools/win32-x64
      - name: Use the shipped media tools for tests
        run: |
          tools="$(cygpath -w "$GITHUB_WORKSPACE/media-tools/win32-x64")"
          "$tools/ffmpeg.exe" -hide_banner -version
          "$tools/ffmpeg.exe" -hide_banner -buildconf
          echo "REACUT_FFMPEG=$tools\\ffmpeg.exe" >> "$GITHUB_ENV"
          echo "REACUT_FFPROBE=$tools\\ffprobe.exe" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Voice-over recording with a simulated microphone
        run: npx tsx tests/recording-electron.ts
      - name: Audio clean-up through the application
        run: npx tsx tests/audio-cleanup-electron.ts
      - name: Real speech recognition with the bundled engine
        run: |
          mkdir -p .test-output/models
          curl --fail --silent --show-error --location --retry 3 -o .test-output/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "bd577a113a864445d4c299885e0cb97d4ba92b5f *.test-output/models/ggml-tiny.bin" | sha1sum -c -
          export REACUT_WHISPER="$(cygpath -w "$GITHUB_WORKSPACE/speech-tools/win32-x64/whisper-cli.exe")"
          export REACUT_SPEECH_MODEL="$(cygpath -w "$GITHUB_WORKSPACE/.test-output/models/ggml-tiny.bin")"
          npx tsx tests/speech-windows.ts
      - name: Run the installer silently
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release -Filter 'JGcut-*-setup.exe' | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $program = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 1 -Filter JGcut.exe | Select-Object -First 1
          if (-not $program) { throw 'The installer did not place JGcut.exe under the per-user Programs folder.' }
          $association = (Get-ItemProperty 'HKCU:\Software\Classes\.jgcut').'(default)'
          if (-not $association) { throw 'The installer did not register .jgcut projects.' }
          Write-Host "Installed to $($program.DirectoryName); .jgcut opens with $association"
          "REACUT_TEST_APP=$($program.DirectoryName)" >> $env:GITHUB_ENV
      - name: Installed application check (Windows)
        run: |
          npm run demo
          npx tsx tests/package-electron.ts
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-evidence
          path: .test-output/package-electron/
      - uses: actions/upload-artifact@v7
        with:
          name: JGcut-Windows
          path: release/JGcut-*-setup.exe
          if-no-files-found: error
  windows-demo:
    # Opt-in with "[windows-demo]" in the pushed commit message: installs the built installer on a
    # Windows desktop, records a short tour and commits the media under docs/windows to this branch.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-demo]')
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: JGcut-Windows
          path: release
      - name: Use a full-size desktop
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Install JGcut and a desktop recorder
        run: |
          $installer = (Get-ChildItem release -Filter 'JGcut-*-setup.exe' | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $program = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 1 -Filter JGcut.exe | Select-Object -First 1
          if (-not $program) { throw 'The installer did not place JGcut.exe under the per-user Programs folder.' }
          $tools = Join-Path $program.DirectoryName 'resources\media-tools'
          "REACUT_TEST_APP=$($program.DirectoryName)" >> $env:GITHUB_ENV
          "REACUT_FFMPEG=$tools\ffmpeg.exe" >> $env:GITHUB_ENV
          "REACUT_FFPROBE=$tools\ffprobe.exe" >> $env:GITHUB_ENV
          choco install ffmpeg --no-progress -y
          $recorder = (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          "REACUT_DEMO_RECORDER=$recorder" >> $env:GITHUB_ENV
      - name: Record the tour
        run: |
          npm run demo
          npx tsx scripts/record-windows-demo.ts
      - name: Commit the recording to this branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/windows
          git commit -m "Record JGcut running on Windows"
          git push origin "HEAD:${GITHUB_REF_NAME}"
