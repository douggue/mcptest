name: Android build

on:
  push:
    branches: [ "ccr-*", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch engine and apply patches
        run: scripts/fetch-engine.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testPlayDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleSideloadDebug :app:assemblePlayDebug

      - uses: actions/upload-artifact@v4
        with:
          name: clonespace-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
