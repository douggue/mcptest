# Public server with a login and automatic HTTPS:
#   docker compose -f docker-compose.server.yml up -d --build
# Needs a .env file with CUTROOM_DOMAIN and CUTROOM_PASSWORD (see DEPLOY.md).
services:
  cutroom:
    build: .
    expose:
      - "8000"
    volumes:
      - cutroom-data:/data
    environment:
      - CUTROOM_PASSWORD=${CUTROOM_PASSWORD:?Set CUTROOM_PASSWORD in .env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${CUTROOM_DOMAIN:?Set CUTROOM_DOMAIN in .env} --to cutroom:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - cutroom
    restart: unless-stopped
volumes:
  cutroom-data:
  caddy-data:
